<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #map { background: #aad3df; }
    .you-icon { background: transparent; border: none; }
    .dest-icon { background: transparent; border: none; }

    #placeCard {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        max-height: 46%;
        display: flex;
        flex-direction: column;
        background: #F8F8FA;
        color: #212121;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        z-index: 2000;
        overflow: hidden;
    }
    #placeCard.hidden { display: none; }
    .place-head {
        display: flex;
        align-items: flex-start;
        padding: 12px 14px 6px 14px;
    }
    .place-info { flex: 1; min-width: 0; }
    .place-name {
        font-size: 17px;
        font-weight: 600;
        color: #212121;
        max-height: 44px;
        overflow: hidden;
    }
    .place-cat {
        margin-top: 2px;
        font-size: 12px;
        font-weight: 600;
        color: #1565c0;
        text-transform: capitalize;
    }
    .place-addr {
        margin-top: 4px;
        font-size: 13px;
        color: #555;
        max-height: 34px;
        overflow: hidden;
    }
    .place-meta {
        margin-top: 4px;
        font-size: 12px;
        color: #777;
        max-height: 32px;
        overflow: hidden;
        word-break: break-all;
    }
    .place-x {
        border: none;
        background: #E0E0E0;
        color: #555;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-size: 16px;
        line-height: 1;
        margin-left: 8px;
        flex: none;
    }
    #placePhotos {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 14px 10px 14px;
    }
    #placePhotos img {
        width: 120px;
        height: 90px;
        object-fit: cover;
        border-radius: 10px;
        background: #ddd;
        flex: none;
    }
    #placeStatus {
        padding: 2px 14px 10px 14px;
        font-size: 13px;
        color: #888;
    }
    .place-nav {
        margin: 0 14px 12px 14px;
        height: 46px;
        border: none;
        border-radius: 23px;
        background: #1565c0;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
    }

    #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3000;
    }
    #lightbox.hidden { display: none; }
    #lightbox img {
        max-width: 96vw;
        max-height: 92vh;
        border-radius: 8px;
    }
    #lightboxX {
        position: absolute;
        top: 12px;
        right: 12px;
        border: none;
        background: rgba(255,255,255,0.2);
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 20px;
    }
</style>
</head>
<body>
<div id="map"></div>

<div id="placeCard" class="hidden">
    <div class="place-head">
        <div class="place-info">
            <div id="placeName" class="place-name"></div>
            <div id="placeCat" class="place-cat"></div>
            <div id="placeAddr" class="place-addr"></div>
            <div id="placeMeta" class="place-meta"></div>
        </div>
        <button id="placeX" class="place-x">✕</button>
    </div>
    <div id="placePhotos"></div>
    <div id="placeStatus"></div>
    <button id="placeNav" class="place-nav">Navigate here</button>
</div>

<div id="lightbox" class="hidden">
    <img id="lightboxImg" alt="">
    <button id="lightboxX">✕</button>
</div>

<script src="leaflet/leaflet.js"></script>
<script src="leaflet/leaflet-rotate.js"></script>
<script>
var map = L.map('map', {
    zoomControl: false,
    rotate: true,
    bearing: 0,
    touchRotate: false,
    rotateControl: false
}).setView([20, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var routeLine = null;
var destMarker = null;
var youMarker = null;
var currentPos = null;
var followMode = true;
var headingUp = true;
var lastBearing = 0;
var placePending = null;

var posIcon = L.divIcon({
    className: 'you-icon',
    html: '<svg class="you-svg" width="30" height="30" viewBox="0 0 30 30">' +
        '<g transform="translate(15,15)">' +
        '<path d="M0 -12 L7 8 L0 4 L-7 8 Z" fill="#1565c0" stroke="#ffffff" stroke-width="2"/>' +
        '<circle cx="0" cy="0" r="3" fill="#ffffff"/>' +
        '</g></svg>',
    iconSize: [30, 30],
    iconAnchor: [15, 15]
});

var destIcon = L.divIcon({
    className: 'dest-icon',
    html: '<svg width="32" height="42" viewBox="0 0 32 42">' +
        '<path d="M16 0 C7 0 0 7 0 16 C0 29 16 42 16 42 C16 42 32 29 32 16 C32 7 25 0 16 0 Z" fill="#d32f2f" stroke="#ffffff" stroke-width="2"/>' +
        '<circle cx="16" cy="16" r="6" fill="#ffffff"/>' +
        '</svg>',
    iconSize: [32, 42],
    iconAnchor: [16, 40]
});

function navBridge() {
    try {
        if (window.NavBridge) { return window.NavBridge; }
    } catch (e) {}
    return null;
}

map.on('dragstart', function () {
    followMode = false;
    var b = navBridge();
    if (b) { try { b.setManualMode(); } catch (e) {} }
});

map.on('click', function (e) {
    selectPlace(e.latlng.lat, e.latlng.lng);
});

function selectPlace(lat, lng) {
    placePending = [lat, lng];
    if (!destMarker) {
        destMarker = L.marker([lat, lng], { icon: destIcon, bubblingMouseEvents: false }).addTo(map);
    } else {
        destMarker.setLatLng([lat, lng]);
    }
    showPoiLoading();
    var b = navBridge();
    if (b) { try { b.onPoiRequest(lat, lng); } catch (e) {} }
}

function startNavToPending() {
    if (!placePending) return;
    var p = placePending;
    placePending = null;
    hidePlaceCard();
    followMode = true;
    var b = navBridge();
    if (b) { try { b.onDestinationPicked(p[0], p[1]); } catch (e) {} }
}

function showPoiLoading() {
    document.getElementById('placeCard').classList.remove('hidden');
    document.getElementById('placeName').textContent = 'Loading place info…';
    document.getElementById('placeCat').textContent = '';
    document.getElementById('placeAddr').textContent = '';
    document.getElementById('placeMeta').textContent = '';
    document.getElementById('placePhotos').innerHTML = '';
    document.getElementById('placeStatus').textContent = '';
}

function hidePlaceCard() {
    document.getElementById('placeCard').classList.add('hidden');
    document.getElementById('lightbox').classList.add('hidden');
}

function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.remove('hidden');
}

document.getElementById('placeX').addEventListener('click', hidePlaceCard);
document.getElementById('placeNav').addEventListener('click', startNavToPending);
document.getElementById('lightboxX').addEventListener('click', function () {
    document.getElementById('lightbox').classList.add('hidden');
});
document.getElementById('lightbox').addEventListener('click', function (e) {
    if (e.target.id === 'lightbox') {
        this.classList.add('hidden');
    }
});

function wrapAngle(a) {
    a = a % 360;
    if (a > 180) { a -= 360; }
    if (a < -180) { a += 360; }
    return a;
}

var currentBearing = 0;
var targetBearing = 0;
var rotating = false;
function stepRotation() {
    var diff = wrapAngle(targetBearing - currentBearing);
    if (Math.abs(diff) < 0.6) {
        currentBearing = targetBearing;
        map.setBearing(currentBearing);
        rotating = false;
        return;
    }
    currentBearing += diff * 0.25;
    map.setBearing(currentBearing);
    requestAnimationFrame(stepRotation);
}
function setRotation(deg) {
    targetBearing = deg;
    if (!rotating) {
        rotating = true;
        requestAnimationFrame(stepRotation);
    }
}
function applyHeading() {
    if (headingUp) {
        setRotation(-lastBearing);
    } else {
        setRotation(0);
    }
}
function centerOnMe() {
    if (!currentPos) return;
    map.setView(currentPos, map.getZoom(), { animate: false });
    applyHeading();
}

window.mapApi = {
    showRoute: function (coords) {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        var latlngs = coords.map(function (p) { return [p[1], p[0]]; });
        if (latlngs.length > 1) {
            routeLine = L.polyline(latlngs, {
                color: '#1565c0', weight: 6, opacity: 0.85, lineJoin: 'round',
                bubblingMouseEvents: false
            }).addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [50, 50], maxZoom: 16 });
        }
        if (followMode) { centerOnMe(); } else { applyHeading(); }
    },
    setDestination: function (lat, lng) {
        if (!destMarker) {
            destMarker = L.marker([lat, lng], { icon: destIcon, bubblingMouseEvents: false }).addTo(map);
        } else {
            destMarker.setLatLng([lat, lng]);
        }
    },
    updatePosition: function (lat, lng, bearing) {
        currentPos = [lat, lng];
        lastBearing = bearing;
        if (!youMarker) {
            youMarker = L.marker(currentPos, { icon: posIcon, zIndexOffset: 1000, keyboard: false }).addTo(map);
        }
        youMarker.setLatLng(currentPos);
        var el = youMarker.getElement();
        if (el) {
            var svg = el.querySelector('.you-svg');
            if (svg) { svg.setAttribute('style', 'transform: rotate(' + bearing + 'deg)'); }
        }
        if (headingUp) { setRotation(-bearing); }
        if (followMode) { centerOnMe(); }
    },
    showPoi: function (poi) {
        document.getElementById('placeCard').classList.remove('hidden');
        if (poi.error) {
            document.getElementById('placeName').textContent = poi.name || 'Selected place';
            document.getElementById('placeCat').textContent = '';
            document.getElementById('placeAddr').textContent = poi.address || '';
            document.getElementById('placeMeta').textContent = '';
            document.getElementById('placeStatus').textContent = 'Could not load place details.';
            return;
        }
        document.getElementById('placeName').textContent = poi.name || 'Selected place';
        document.getElementById('placeCat').textContent = poi.category || '';
        document.getElementById('placeAddr').textContent = poi.address || '';
        var meta = [];
        if (poi.phone) { meta.push(poi.phone); }
        if (poi.hours) { meta.push(poi.hours); }
        if (poi.website) { meta.push(poi.website); }
        document.getElementById('placeMeta').textContent = meta.join('  ·  ');
        var photosEl = document.getElementById('placePhotos');
        photosEl.innerHTML = '';
        var photos = poi.photos || [];
        if (photos.length === 0) {
            document.getElementById('placeStatus').textContent = 'No photos nearby.';
        } else {
            document.getElementById('placeStatus').textContent = photos.length + ' photo' + (photos.length > 1 ? 's' : '') + ' nearby';
            for (var i = 0; i < photos.length; i++) {
                (function (src) {
                    var img = document.createElement('img');
                    img.src = src;
                    img.alt = '';
                    img.addEventListener('click', function () { openLightbox(src); });
                    photosEl.appendChild(img);
                })(photos[i].thumb || photos[i].orig);
            }
        }
    },
    setHeadingMode: function (on) {
        headingUp = !!on;
        applyHeading();
    },
    zoomIn: function () {
        map.zoomIn();
    },
    zoomOut: function () {
        map.zoomOut();
    },
    recenter: function () {
        followMode = true;
        if (currentPos) {
            map.setView(currentPos, Math.max(map.getZoom(), 16), { animate: false });
        }
        applyHeading();
    },
    clearRoute: function () {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    },
    clear: function () {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
        if (youMarker) { map.removeLayer(youMarker); youMarker = null; }
        currentPos = null;
    }
};

var b = navBridge();
if (b) { try { b.onMapReady(); } catch (e) {} }
</script>
</body>
</html>
