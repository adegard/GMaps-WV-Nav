<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #map { background: #aad3df; }
    .you-icon { background: transparent; border: none; pointer-events: none; }
    .you-wrap { position: relative; transition: top 0.25s ease; }
    .you-wrap.bottom { top: calc(100vh * 0.25); }
    .dest-icon { background: transparent; border: none; }
    #tip {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: rgba(33,33,33,0.85);
        color: #fff;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12px;
        z-index: 1000;
        pointer-events: none;
        display: none;
    }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip">Long-press anywhere to navigate there</div>
<script src="leaflet/leaflet.js"></script>
<script src="leaflet/leaflet-rotate.js"></script>
<script>
var map = L.map('map', {
    zoomControl: false,
    rotate: true,
    bearing: 0,
    touchRotate: false,
    rotateControl: false
}).setView([20, 0], 2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var routeLine = null;
var destMarker = null;
var youMarker = null;
var currentPos = null;
var followMode = true;
var headingUp = true;
var lastBearing = 0;

var posIcon = L.divIcon({
    className: 'you-icon',
    html: '<div class="you-wrap" style="width:30px;height:30px">' +
        '<svg class="you-svg" width="30" height="30" viewBox="0 0 30 30">' +
        '<g transform="translate(15,15)">' +
        '<path d="M0 -10.5 C-3.2 -10.5 -5.2 -8.8 -5.8 -7 L-8.6 4.5 C-9.2 6.6 -8.2 7.8 -6.6 8 L-6.6 9 L6.6 9 L6.6 8 C8.2 7.8 9.2 6.6 8.6 4.5 L5.8 -7 C5.2 -8.8 3.2 -10.5 0 -10.5 Z" fill="#1565c0" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<path d="M-4.2 -8.3 C-4.2 -9.5 -3.1 -10.1 -1.8 -10.1 L1.8 -10.1 C3.1 -10.1 4.2 -9.5 4.2 -8.3 L3.3 -3.4 L-3.3 -3.4 Z" fill="#0d47a1"/>' +
        '<rect x="-6.8" y="-5.8" width="1.8" height="1.5" rx="0.75" fill="#ffe082"/>' +
        '<rect x="5" y="-5.8" width="1.8" height="1.5" rx="0.75" fill="#ffe082"/>' +
        '<rect x="-5.4" y="4.5" width="2" height="2.6" rx="0.6" fill="#ff5252"/>' +
        '<rect x="3.4" y="4.5" width="2" height="2.6" rx="0.6" fill="#ff5252"/>' +
        '</g></svg></div>',
    iconSize: [30, 30],
    iconAnchor: [15, 15]
});

var destIcon = L.divIcon({
    className: 'dest-icon',
    html: '<svg width="32" height="42" viewBox="0 0 32 42">' +
        '<path d="M16 0 C7 0 0 7 0 16 C0 29 16 42 16 42 C16 42 32 29 32 16 C32 7 25 0 16 0 Z" fill="#d32f2f" stroke="#ffffff" stroke-width="2"/>' +
        '<circle cx="16" cy="16" r="6" fill="#ffffff"/>' +
        '</svg>',
    iconSize: [32, 42],
    iconAnchor: [16, 40]
});

function navBridge() {
    try {
        if (window.NavBridge) { return window.NavBridge; }
    } catch (e) {}
    return null;
}

function applyFollowOffset() {
    if (!youMarker) return;
    var el = youMarker.getElement();
    if (!el) return;
    var w = el.querySelector('.you-wrap');
    if (w) { w.classList.toggle('bottom', followMode); }
}

map.on('dragstart', function () {
    followMode = false;
    applyFollowOffset();
    var b = navBridge();
    if (b) { try { b.setManualMode(); } catch (e) {} }
});

map.on('contextmenu', function (e) {
    var b = navBridge();
    if (b) { try { b.onDestinationPicked(e.latlng.lat, e.latlng.lng); } catch (e2) {} }
});

var tipTimer = null;
function showTip() {
    var tip = document.getElementById('tip');
    tip.style.display = 'block';
    if (tipTimer) { clearTimeout(tipTimer); }
    tipTimer = setTimeout(function () {
        tip.style.display = 'none';
    }, 3500);
}
setTimeout(showTip, 1500);

function wrapAngle(a) {
    a = a % 360;
    if (a > 180) { a -= 360; }
    if (a < -180) { a += 360; }
    return a;
}

var currentBearing = 0;
var targetBearing = 0;
var rotating = false;
function stepRotation() {
    var diff = wrapAngle(targetBearing - currentBearing);
    if (Math.abs(diff) < 0.6) {
        currentBearing = targetBearing;
        map.setBearing(currentBearing);
        rotating = false;
        return;
    }
    currentBearing += diff * 0.25;
    map.setBearing(currentBearing);
    requestAnimationFrame(stepRotation);
}
function setRotation(deg) {
    targetBearing = deg;
    if (!rotating) {
        rotating = true;
        requestAnimationFrame(stepRotation);
    }
}
function applyHeading() {
    if (headingUp) {
        setRotation(-lastBearing);
    } else {
        setRotation(0);
    }
}
function centerOnMe() {
    if (!currentPos) return;
    map.setView(currentPos, map.getZoom(), { animate: false });
    applyHeading();
}

window.mapApi = {
    showRoute: function (coords) {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        var latlngs = coords.map(function (p) { return [p[1], p[0]]; });
        if (latlngs.length > 1) {
            routeLine = L.polyline(latlngs, {
                color: '#1565c0', weight: 6, opacity: 0.85, lineJoin: 'round',
                bubblingMouseEvents: false
            }).addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [50, 50], maxZoom: 16 });
        }
        if (followMode) { centerOnMe(); } else { applyHeading(); }
    },
    setDestination: function (lat, lng) {
        if (!destMarker) {
            destMarker = L.marker([lat, lng], { icon: destIcon, bubblingMouseEvents: false }).addTo(map);
        } else {
            destMarker.setLatLng([lat, lng]);
        }
    },
    updatePosition: function (lat, lng, bearing) {
        currentPos = [lat, lng];
        lastBearing = bearing;
        if (!youMarker) {
            youMarker = L.marker(currentPos, { icon: posIcon, zIndexOffset: 1000, keyboard: false }).addTo(map);
        }
        youMarker.setLatLng(currentPos);
        applyFollowOffset();
        var el = youMarker.getElement();
        if (el) {
            var svg = el.querySelector('.you-svg');
            if (svg) { svg.setAttribute('style', 'transform: rotate(' + bearing + 'deg)'); }
        }
        if (headingUp) { setRotation(-bearing); }
        if (followMode) { centerOnMe(); }
    },
    setHeadingMode: function (on) {
        headingUp = !!on;
        applyHeading();
    },
    zoomIn: function () {
        map.zoomIn();
    },
    zoomOut: function () {
        map.zoomOut();
    },
    recenter: function () {
        followMode = true;
        applyFollowOffset();
        if (currentPos) {
            map.setView(currentPos, Math.max(map.getZoom(), 16), { animate: false });
        }
        applyHeading();
    },
    clearRoute: function () {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    },
    clear: function () {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
        if (youMarker) { map.removeLayer(youMarker); youMarker = null; }
        currentPos = null;
    }
};

var b = navBridge();
if (b) { try { b.onMapReady(); } catch (e) {} }
</script>
</body>
</html>
