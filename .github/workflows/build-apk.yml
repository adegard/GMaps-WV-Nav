name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Rename APKs
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "GMaps-WV-Nav-v${VERSION}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "GMaps-WV-Nav-v${VERSION}-debug.apk"
          ls -la *.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gmaps-wv-nav-release
          path: GMaps-WV-Nav-*-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gmaps-wv-nav-debug
          path: GMaps-WV-Nav-*-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "GMaps-WV-Nav-v${VERSION}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GMaps WV Nav ${{ github.ref_name }}
          files: GMaps-WV-Nav-*-release.apk
          overwrite: true
          generate_release_notes: true
